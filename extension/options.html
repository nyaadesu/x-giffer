<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; padding: 12px; min-width: 320px; }
      label { display: grid; grid-template-columns: 1fr 90px; align-items: center; gap: 8px; margin-bottom: 10px; }
      input { width: 100%; box-sizing: border-box; }
      small { color: GrayText; }
      #status { min-height: 1.5em; }
    </style>
  </head>
  <body>
    <label>Frames per second <input id="fps" type="number" min="1" max="50" /></label>
    <label>Max width (px, 0 = original) <input id="maxWidth" type="number" min="0" step="10" /></label>
    <label>Colors per frame <input id="colors" type="number" min="2" max="256" /></label>
    <small>Higher FPS / width / colors means bigger files and slower conversion.</small>
    <p id="status"></p>
    <script type="module" src="options.js"></script>
  </body>
</html>
