<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; padding: 12px; min-width: 320px; }
      label { display: grid; gap: 6px; }
      select { width: 100%; padding: 4px; font: inherit; }
      small { color: GrayText; }
      #status { min-height: 1.5em; }
    </style>
  </head>
  <body>
    <label>GIF quality <select id="preset"></select></label>
    <p><small>Original keeps the source's size and frame timing. Smaller presets make lighter files.</small></p>
    <p id="status"></p>
    <script type="module" src="options.js"></script>
  </body>
</html>
