<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1419" />
    <title>X Giffer</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" />
    <style>
      :root {
        --bg: #0f1419; --fg: #e7e9ea; --muted: #8b98a5; --line: #2f3336;
        --accent: #1d9bf0; --card: #16181c; --err: #f4212e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--fg);
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
      h1 { font-size: 20px; margin: 0; }
      p.tagline { margin: 0 0 8px; color: var(--muted); font-size: 13px; font-style: italic; }
      p.lead { color: var(--muted); margin: 0 0 16px; }
      form { display: flex; gap: 8px; }
      input[type="url"], input[type="text"] {
        flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px;
        border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit;
      }
      button, a.btn {
        padding: 10px 16px; border-radius: 999px; border: 0; background: var(--accent);
        color: #fff; font: 700 14px/1.2 inherit; cursor: pointer; text-decoration: none;
        display: inline-flex; align-items: center; justify-content: center;
      }
      button.secondary, a.btn.secondary { background: transparent; border: 1px solid var(--line); color: var(--fg); }
      button:disabled { opacity: 0.5; cursor: progress; }
      #status { min-height: 1.5em; margin: 14px 0; color: var(--muted); }
      #status.error { color: var(--err); }
      progress { width: 100%; height: 6px; accent-color: var(--accent); }
      .result { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-top: 12px; }
      .result img { display: block; width: 100%; border-radius: 10px; background: #000; }
      .result .meta { color: var(--muted); font-size: 13px; margin: 8px 0; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      label.preset { display: flex; align-items: center; gap: 10px; margin-top: 10px; color: var(--muted); }
      label.preset select {
        flex: 1; min-width: 0; padding: 8px 10px; border-radius: 10px; font: inherit;
        border: 1px solid var(--line); background: var(--card); color: var(--fg);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>X Giffer</h1>
      <p class="tagline">pronounced &ldquo;jiffer&rdquo;</p>
      <p class="lead">Share an X post to this app, or paste its link. Conversion runs on your device.</p>
      <form id="form">
        <input id="link" type="text" inputmode="url" placeholder="https://x.com/user/status/…" autocomplete="off" />
        <button id="go" type="submit">Get GIF</button>
      </form>
      <label class="preset">Quality <select id="preset"></select></label>
      <div id="status"></div>
      <progress id="progress" hidden max="1" value="0"></progress>
      <div id="results"></div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
